[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-click-prediction"
version = "0.1.0"
description = "Real-time ad-click prediction system using LightGBM and FastAPI"
requires-python = ">=3.11"
dependencies = [
    # ML core
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "optuna>=3.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",

    # Experiment tracking
    "mlflow>=2.12",

    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",

    # Feature store
    "redis>=5.0",

    # Monitoring
    "evidently>=0.7",
    "psycopg2-binary>=2.9",
    "streamlit>=1.35",
    "plotly>=5.21",

    # Data versioning
    "dvc>=3.50",

    # Utilities
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "httpx>=0.27",         # for async API tests
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
