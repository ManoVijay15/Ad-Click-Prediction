services:
  postgres:
    image: postgres:15-alpine
    container_name: adclick_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adclick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adclick}
      POSTGRES_DB: ${POSTGRES_DB:-adclick_mlflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adclick"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.1
    container_name: adclick_mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow/data
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/data/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

  redis:
    image: redis:7-alpine
    container_name: adclick_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: adclick_api
    depends_on:
      redis:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      REDIS_URL: redis://redis:6379
      MODEL_NAME: ad-click-lgbm
      MODEL_STAGE: Production
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  mlflow_data:
  mlflow_artifacts:
  redis_data:
